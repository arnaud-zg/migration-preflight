name: "@migration-preflight/postgres"
description: "Postgres: the PGlite database and the drizzle PGlite runner."
labels: ["pkg: @migration-preflight/postgres"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, or what do you want?
      description: A bug, an idea or a question. One sentence is enough to start.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: Optional. A migration, a test, versions (`node -v`, the package's version).
      render: shell
